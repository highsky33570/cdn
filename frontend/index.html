<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TyCDN</title>
    <!--
      Resolve the theme before first paint so the page never flashes the wrong
      background. Mirrors src/composables/useTheme.js: saved choice wins,
      otherwise follow the OS. Sets data-theme on <html> for our CSS tokens.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tycdn-theme');
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
